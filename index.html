<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <!-- 1. The meta refresh handles the automatic redirect after 0 seconds -->
  <meta http-equiv="refresh" content="0; url=https://your-new-website.github.io/">
  <!-- 2. The canonical link tells search engines where the true page lives -->
  <link rel="canonical" href="https://your-new-website.github.io/">
</head>
<body>
  <p>This page has moved. If you are not redirected automatically, follow this <a href="https://your-new-website.github.io/">link to the new site</a>.</p>
</body>
</html>
